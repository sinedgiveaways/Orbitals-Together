# tools/migrate_config.py on a Windows runner: a user environment variable and a PowerShell profile carrying old names
# are migrated and checked (the registry code can't be run anywhere else). It touches only the runner's throwaway user.
name: Migration script (Windows)

on:
  push:
    branches: [orbitals-port]
    paths: [tools/migrate_config.py, tools/migrate/**, .github/workflows/migrate-windows.yml]
  pull_request:
    branches: [orbitals-port]
    paths: [tools/migrate_config.py, tools/migrate/**, .github/workflows/migrate-windows.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Old names in the user environment, a PowerShell profile and an install folder
        shell: pwsh
        run: |
          [Environment]::SetEnvironmentVariable("MKW_CI_FPS", "60", "User")
          [Environment]::SetEnvironmentVariable("MKW_CI_PATHY", "%USERPROFILE%\x", [EnvironmentVariableTarget]::User)
          New-Item -ItemType Directory -Force -Path (Split-Path $PROFILE.CurrentUserAllHosts) | Out-Null
          Set-Content -Path $PROFILE.CurrentUserAllHosts -Value '$env:MKW_CI_PROFILE = "1"', '$env:Path += ";x"' -Encoding utf8BOM
          New-Item -ItemType Directory -Force -Path inst | Out-Null
          Set-Content -Path inst\mkw.ini -Value "[game]", "MKW_SEED=3"
      - name: Dry run changes nothing
        shell: pwsh
        run: |
          python tools/migrate_config.py --dir inst
          if (-not [Environment]::GetEnvironmentVariable("MKW_CI_FPS", "User")) { throw "the dry run changed the registry" }
          if (-not (Test-Path inst\mkw.ini)) { throw "the dry run moved mkw.ini" }
      - name: Apply
        shell: pwsh
        run: python tools/migrate_config.py --dir inst --apply
      - name: Check
        shell: pwsh
        run: |
          function Need($ok, $what) { if (-not $ok) { throw "FAILED: $what" } else { "ok: $what" } }
          Need ([Environment]::GetEnvironmentVariable("ORBITALS_CI_FPS", "User") -eq "60") "ORBITALS_CI_FPS = 60"
          Need ($null -eq [Environment]::GetEnvironmentVariable("MKW_CI_FPS", "User")) "MKW_CI_FPS deleted"
          Need ([Environment]::GetEnvironmentVariable("ORBITALS_CI_PATHY", "User") -eq "%USERPROFILE%\x") "unexpanded value kept (REG_EXPAND_SZ)"
          $p = Get-Content $PROFILE.CurrentUserAllHosts -Raw
          Need ($p -match "ORBITALS_CI_PROFILE" -and $p -notmatch "MKW_") "profile rewritten"
          $bytes = [System.IO.File]::ReadAllBytes($PROFILE.CurrentUserAllHosts)
          Need (($bytes[0..2] -join ",") -eq "239,187,191") "profile keeps its UTF-8 BOM"
          Need ((Get-ChildItem (Split-Path $PROFILE.CurrentUserAllHosts) -Filter "*.bak").Count -ge 1) "profile .bak"
          Need ((Get-Content inst\orbitals.ini -Raw) -match "ORBITALS_SEED=3") "orbitals.ini written"
          Need (Test-Path inst\mkw.ini.bak) "mkw.ini kept as .bak"
          Need ((Get-ChildItem $HOME -Filter "orbitals-migrate-backup-*.json").Count -ge 1) "registry backup written"
